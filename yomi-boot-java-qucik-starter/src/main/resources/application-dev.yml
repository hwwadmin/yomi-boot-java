# 开发环境（默认 profile：dev）
logging:
  level:
    root: INFO
    com.yomi: INFO
    org.apache.kafka: WARN
    org.springframework.kafka: WARN

server:
  port: 28080

spring:
  datasource:
    url: jdbc:mysql://${YOMI_DB_HOST:localhost}:${YOMI_DB_PORT:3306}/${YOMI_DB_DATABASE:yomi_boot_java}?characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&socketTimeout=60000
    username: ${YOMI_DB_USER:admin}
    password: ${YOMI_DB_PASSWORD:hww350521}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: 1
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: ${YOMI_REDIS_HOST:localhost}
      port: ${YOMI_REDIS_PORT:6379}
      password: ${YOMI_REDIS_PASSWORD:hww350521}
      database: ${YOMI_REDIS_DATABASE:0}
      timeout: 3000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: SASL_PLAINTEXT
      sasl.mechanism: PLAIN
      sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_SASL_USERNAME:zwei}" password="${KAFKA_SASL_PASSWORD:hww350521}";
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    listener:
      ack-mode: manual

# Micrometer 链路追踪（Brave + Zipkin）
management:
  tracing:
    sampling:
      # 采样比例，1.0 表示全量
      probability: 1.0
    export:
      zipkin:
        # 是否上报 Zipkin；本地无服务时建议 false
        enabled: ${ZIPKIN_ENABLED:false}
        # Zipkin HTTP 上报地址
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# YOMI框架配置
yomi:
  id:
    # 雪花 worker 编号（0~31，必配，多实例勿重复；缺失即启动失败）
    worker-id: ${YOMI_ID_WORKER_ID:1}
    # 雪花机房编号（0~31，缺省 0）
    datacenter-id: ${YOMI_ID_DATACENTER_ID:0}
  cors:
    # 是否启用 CORS
    enabled: true
    # 拦截路径（PathPattern）
    path-pattern: "/**"
    # 允许的来源；allow-credentials=true 时不能为 *
    allowed-origins:
      - "*"
    # 来源通配，如 https://*.example.com
    allowed-origin-patterns: []
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    # 允许浏览器读取的响应头
    exposed-headers: []
    # 是否允许携带 Cookie 等凭证
    allow-credentials: false
    # 预检 OPTIONS 缓存时间（秒）
    max-age: 1800
  # @RequestLimit 限流 Redis 键前缀
  ratelimit: "yomi:ratelimit:${spring.application.name}:"
  token:
    # 是否启用登录令牌
    enabled: true
    # 令牌默认有效期
    ttl: 2h
    # true 允许多端同时登录；false 为单点（新登录踢旧 token）
    allow-multi-login: false
    # 校验通过时是否按 ttl 滑动续期
    renew-on-validate: false
    # 会话绝对存活上限：滑动续期不得超过 issuedAt + 该时长（0=不限制，不建议）
    max-lifetime: 1d
    # 进程内会话缓存 TTL；0=关闭。条目 TTL 取 min(本值, 令牌剩余有效期)；
    # 撤销/踢人经 Redis pub/sub 通知各实例即时失效，通知丢失时最迟本值内生效
    local-cache-ttl: 30s
    # Redis 键前缀
    store-prefix: "yomi:token:${spring.application.name}"
    # 不校验令牌的路径（PathPattern）
    skip-validate-paths:
      - /static/**
      - /public/**
      - /views/**
      - /actuator/**
      - /test/ds/**
    # 单点登录签发：等锁最长时间
    lock-wait: 5s
    # 单点登录签发：持锁最长时间
    lock-lease: 30s
  captcha:
    # 是否启用验证码组件
    enabled: true
    # 存储：auto（配了 Redis 用 redis，否则 local）/ local / redis
    store: auto
    # Redis 键前缀（store=redis 时使用）
    store-prefix: "yomi:captcha:${spring.application.name}"
    # 挑战有效期
    ttl: 2m
    # 默认挑战类型：text（读图输入）/ arithmetic（看图算数）
    default-type: text
  idempotency:
    # 是否启用接口幂等
    enabled: true
    # Redis 键前缀
    store-prefix: "yomi:idempotency:${spring.application.name}"
    # 成功结果在 Redis 中的缓存时间
    result-cache-ttl: 5m
    # 幂等记录在库中的保留时长
    record-retention: 7d
    # 抢幂等锁最长等待
    lock-wait: 3s
    # 持锁租期；0 表示看门狗自动续期
    lock-lease: 0s
    # 是否定时清理僵死的「处理中」记录
    stale-cleaner-enabled: true
    # 清理任务执行间隔
    scan-interval: 10m
    # 超过该时长仍为处理中则视为僵死并删除
    stale-timeout: 60m
    # 单条 DELETE 删除的行数（限额删除的块大小）
    chunk-size: 1000
    # 单轮每类最多删除条数（两类各自封顶）
    max-delete-per-run: 50000
  oss:
    # 是否启用 OSS 组件
    enabled: true
    # 实现：s3 | rustfs | alioss
    provider: rustfs
    # 对象公开访问基址；只用预签名可留空
    public-base-url: ""
    # 预签名 URL 最长有效期
    max-presign-expiry: 30m
    # 本地 RustFS（docker run -d -p 9000:9000 rustfs/rustfs:1.0.1）；测试桶 yomi-test 需已存在
    rustfs:
      endpoint: http://127.0.0.1:9000
      access-key-id: rustfsadmin
      secret-access-key: rustfsadmin
  event:
    # 发件箱写库并投递 Kafka
    publisher-enabled: true
    # 收件箱消费幂等守卫
    consumer-enabled: true
    # 每轮从发件箱拉取条数上限
    fetch-batch-size: 50
    # 并发发送线程数
    dispatch-parallelism: 2
    # 发送队列容量，满则待发恢复为 PENDING
    dispatch-queue-capacity: 64
    # DLQ 重试占用 retry_after 的时长，防并行重复投递
    dlq-in-flight-lease: 90s
    # 保留期清理（默认关闭）：开启后按保留期物理删除历史行，表不再只增不删
    retention:
      # 发件箱清理开关（需发布侧）
      outbox-retention-enabled: true
      # 发件箱已成功行保留期：SENT_SUCCESS 且 sent_time 超期即删除（PENDING/FETCHED/SENT_FAIL 与 DLQ 在途行不删）
      outbox-retention: 14d
      # 收件箱清理开关（需消费侧），与发件箱开关互不依赖；保留期必须 >= 事件可能被重投的最长时间
      # （Kafka topic retention，默认 7 天），否则超期重投的事件会被当作新消息再消费一次——演示环境保持关闭
      inbox-retention-enabled: false
      inbox-retention: 14d
      # 扫描间隔 / 每批删除行数 / 单轮删除上限
      scan-interval: 1h
      batch-size: 1000
      max-delete-per-run: 50000
  rbac:
    # 启用 RBAC
    enabled: true
    # true=Redis 投影，false=走 SQL
    projection-enabled: true
    # 启动时刷新投影
    bootstrap-refresh: true
    # 定时刷新投影
    scheduled-refresh-enabled: false
    # 鉴权用路径：REQUEST_URI 或 SERVLET_PATH
    http-path-style: REQUEST_URI
    # RBAC 放行路径
    skip-authorize-paths:
      - /static/**
      - /public/**
      - /views/**
      - /actuator/**
      - /test/ds/**
  httplog:
    # 启用 HTTP 请求日志（组件 component-httplog；表需手工建，脚本见仓库根目录 sql/mysql|pgsql/t_sys_http_log.sql）
    enabled: true
    # 传输模式
    mode: redis
    redis:
      # list 队列长度上限（0=不限）：超限丢队首最旧日志。
      max-length: 10000
    collect:
      # 头/体/响应全采（默认即全采，此段为显式展示）
      record-request-headers: true
      record-request-body: true
      record-response-headers: true
      record-response-body: true
    desensitize:
      # 键名 → 策略名（component-desensitize 的 mask(策略名, 值)）；
      # EMPLOYEE_NO 为宿主自定义策略（见 TestHttpLogStrategyConfig 的 KeepEdge(4,2)）
      key-types:
        authorization: ALL
        cookie: ALL
        password: PASSWORD
        mobile: MOBILE
        employeeNo: EMPLOYEE_NO
        token: ALL
