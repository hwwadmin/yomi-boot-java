# 生产环境（SPRING_PROFILES_ACTIVE=prod）
logging:
  level:
    root: INFO
    com.yomi: INFO
    org.apache.kafka: WARN
    org.springframework.kafka: WARN

server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:mysql://${YOMI_DB_HOST}:${YOMI_DB_PORT:3306}/${YOMI_DB_DATABASE}?characterEncoding=UTF-8&useSSL=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${YOMI_DB_USER}
    password: ${YOMI_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: 1
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: ${YOMI_REDIS_HOST}
      port: ${YOMI_REDIS_PORT:6379}
      password: ${YOMI_REDIS_PASSWORD:}
      database: ${YOMI_REDIS_DATABASE:0}
      timeout: 3000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_SASL_USERNAME}" password="${KAFKA_SASL_PASSWORD}";
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    listener:
      ack-mode: manual

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    export:
      zipkin:
        enabled: ${ZIPKIN_ENABLED:true}
        endpoint: ${ZIPKIN_ENDPOINT}

yomi:
  id:
    worker-id: ${YOMI_ID_WORKER_ID:1}
    datacenter-id: ${YOMI_ID_DATACENTER_ID:0}
  cors:
    enabled: true
    path-pattern: "/**"
    allowed-origins:
      - "*"
    allowed-origin-patterns: []
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    exposed-headers: []
    allow-credentials: false
    max-age: 1800
  ratelimit: "yomi:ratelimit:${spring.application.name}:"
  token:
    enabled: true
    ttl: 2h
    allow-multi-login: false
    renew-on-validate: false
    max-lifetime: 1d
    local-cache-ttl: 30s
    store-prefix: "yomi:token:${spring.application.name}"
    skip-validate-paths:
      - /static/**
      - /public/**
      - /views/**
      - /actuator/**
      - /test/ds/**
    lock-wait: 5s
    lock-lease: 30s
  captcha:
    enabled: true
    store: auto
    store-prefix: "yomi:captcha:${spring.application.name}"
    ttl: 2m
    default-type: text
  idempotency:
    enabled: true
    store-prefix: "yomi:idempotency:${spring.application.name}"
    result-cache-ttl: 5m
    record-retention: 7d
    lock-wait: 3s
    lock-lease: 0s
    stale-cleaner-enabled: true
    scan-interval: 10m
    stale-timeout: 60m
    batch-size: 100
  oss:
    enabled: true
    provider: alioss
    public-base-url: ""
    max-presign-expiry: 30m
    alioss:
      region: ${YOMI_OSS_ALIOSS_REGION}
      access-key-id: ${YOMI_OSS_ALIOSS_ACCESS_KEY_ID}
      secret-access-key: ${YOMI_OSS_ALIOSS_SECRET_ACCESS_KEY}
      endpoint: ${YOMI_OSS_ALIOSS_ENDPOINT}
      use-path-style: ${YOMI_OSS_ALIOSS_USE_PATH_STYLE:false}
  event:
    publisher-enabled: true
    consumer-enabled: true
    fetch-batch-size: 50
    dispatch-parallelism: 2
    dispatch-queue-capacity: 64
    dlq-in-flight-lease: 90s
    retention:
      enabled: false
      outbox-retention: 14d
      inbox-retention-enabled: false
      inbox-retention: 14d
      scan-interval: 1h
      batch-size: 1000
      max-delete-per-run: 50000
  roundrobin:
    enabled: true
    store-prefix: "yomi:roundrobin:${spring.application.name}"
  rbac:
    enabled: false
    projection-enabled: true
    bootstrap-refresh: true
    scheduled-refresh-enabled: false
  httplog:
    enabled: true
    mode: redis
    redis:
      max-length: 10000
    collect:
      record-request-headers: true
      record-request-body: true
      record-response-headers: true
      record-response-body: true
    desensitize:
      key-types:
        authorization: ALL
        cookie: ALL
        password: PASSWORD
        mobile: MOBILE
        employeeNo: EMPLOYEE_NO
        token: ALL

